name: Repair source manifest
on:
  push:
    branches: [fix/release-tag-preflight-node24]
    paths:
      - '.manifest-repair/ready'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-tag-preflight-node24
          fetch-depth: 0
      - name: Regenerate, verify, clean up, and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .manifest-repair .github/workflows/repair-source-manifest.yml
          bash scripts/write-source-manifest.sh
          bash scripts/verify-source-manifest.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore: regenerate exact source manifest'
          git push origin HEAD:fix/release-tag-preflight-node24
