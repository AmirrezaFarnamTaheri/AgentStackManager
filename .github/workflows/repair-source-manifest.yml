name: Repair source manifest
on:
  push:
    branches: [fix/release-tag-preflight-node24]
    paths:
      - '.manifest-repair/ready'
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-tag-preflight-node24
          fetch-depth: 0
      - name: Regenerate, verify, clean up, and commit
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .manifest-repair .github/workflows/repair-source-manifest.yml
          bash scripts/write-source-manifest.sh
          bash scripts/verify-source-manifest.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SOURCE_MANIFEST.sha256
          git commit -m 'chore: regenerate exact source manifest'
          git push origin HEAD:fix/release-tag-preflight-node24
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dispatch Verify on repaired head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIRED_SHA: ${{ steps.repair.outputs.sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/dispatches" \
            -d '{"ref":"fix/release-tag-preflight-node24"}'
          echo "Dispatched Verify for ${REPAIRED_SHA}"
