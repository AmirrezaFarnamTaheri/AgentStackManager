name: Signed GitHub Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && 'automatic' || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the automatically versioned GitHub Release as a prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: signed-release-${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-sign-package:
    name: Build, sign, and attest
    runs-on: windows-2025
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Install pinned release tools
        shell: pwsh
        run: |
          go install github.com/sigstore/gitsign@v0.16.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/anchore/syft/cmd/syft@v1.50.0
          gitsign --version
          govulncheck -version
          syft version

      - name: Resolve, create, and verify release identity
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch release tags' }
          git fetch --force --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch authoritative origin/main' }

          $head = (git rev-parse HEAD).Trim()
          $originMain = (git rev-parse refs/remotes/origin/main).Trim()
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $head -ne $originMain) {
            throw "Manual release must run from current origin/main; HEAD=$head origin/main=$originMain"
          }

          $tagPattern = '^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$'
          $tag = $null
          $trustMode = $null

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            git config --local user.name 'github-actions[bot]'
            git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config --local gpg.format x509
            git config --local gpg.x509.program (Get-Command gitsign -ErrorAction Stop).Source

            $identity = "https://github.com/$env:WORKFLOW_REF"
            $issuer = 'https://token.actions.githubusercontent.com'

            foreach ($existingTag in @(git tag --points-at HEAD --list 'v*' --sort=-v:refname)) {
              if ($existingTag -notmatch $tagPattern) { continue }
              if ((git cat-file -t "refs/tags/$existingTag").Trim() -ne 'tag') { continue }
              $tagObject = git cat-file -p "refs/tags/$existingTag"
              if (($tagObject -join "`n") -notmatch 'Managed-By: AgentStackManager release workflow') { continue }
              gh release view $existingTag --repo $env:GH_REPO *> $null
              if ($LASTEXITCODE -eq 0) { continue }
              gitsign verify --certificate-identity $identity --certificate-oidc-issuer $issuer "refs/tags/$existingTag"
              if ($LASTEXITCODE -ne 0) { throw "Existing automated tag failed Sigstore verification: $existingTag" }
              $tag = $existingTag
              $trustMode = 'sigstore'
              break
            }

            if (-not $tag) {
              $stableTags = @(git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
              if ($stableTags.Count -eq 0) {
                $major = 1
                $minor = 0
                $patch = 0
              } else {
                $latestTag = $stableTags[0]
                if ($latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Invalid stable tag: $latestTag" }
                $major = [int]$Matches[1]
                $minor = [int]$Matches[2]
                $patch = [int]$Matches[3]
                $latestCommit = (git rev-list -n 1 $latestTag).Trim()
                if ($latestCommit -eq $head) { throw "HEAD is already released as $latestTag" }

                $messages = (git log --format='%B%n---END-COMMIT---' "$latestTag..HEAD") -join "`n"
                if ($messages -match '(?m)^[A-Za-z]+(?:\([^)]+\))?!:' -or $messages -match '(?m)^BREAKING(?: |-)?CHANGE:') {
                  $major++
                  $minor = 0
                  $patch = 0
                } elseif ($messages -match '(?m)^feat(?:\([^)]+\))?:') {
                  $minor++
                  $patch = 0
                } else {
                  $patch++
                }
              }

              $version = "$major.$minor.$patch"
              if ($env:DISPATCH_PRERELEASE -eq 'true') {
                $version = "$version-rc.$env:GITHUB_RUN_NUMBER"
              }
              $tag = "v$version"
              if (git show-ref --tags --verify --quiet "refs/tags/$tag") {
                throw "Automatically selected tag already exists: $tag"
              }

              $message = @(
                "Automated release $tag",
                '',
                'Managed-By: AgentStackManager release workflow',
                "Source-Commit: $head",
                "Workflow-Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
              ) -join "`n"
              git tag -s $tag -m $message
              if ($LASTEXITCODE -ne 0) { throw "Unable to create keyless signed tag: $tag" }
              gitsign verify --certificate-identity $identity --certificate-oidc-issuer $issuer "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "New automated tag failed Sigstore verification: $tag" }
              git push origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "Unable to push automated tag: $tag" }
              $trustMode = 'sigstore'
            }
          } else {
            $tag = $env:PUSH_TAG.Trim()
            if ($tag -notmatch $tagPattern) {
              throw "Release tag must match vX.Y.Z or vX.Y.Z-prerelease; received '$tag'"
            }
            git show-ref --tags --verify --quiet "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Tag does not exist in the repository: $tag" }
            if ((git cat-file -t "refs/tags/$tag").Trim() -ne 'tag') { throw "$tag must be an annotated tag" }
            $trustMode = 'gpg'
          }

          if ($tag -notmatch $tagPattern) { throw "Resolved invalid release tag: $tag" }
          $version = $tag.Substring(1)
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($tagCommit -ne $head) { throw "Release tag $tag points to $tagCommit, but HEAD is $head" }
          if ($tagCommit -ne $originMain) { throw "Release tag $tag must point to authoritative origin/main $originMain" }

          $isPrerelease = $version.Contains('-') -or $env:DISPATCH_PRERELEASE -eq 'true'
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "trust_mode=$trustMode" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Configure and verify release tag trust
        shell: pwsh
        env:
          TRUST_MODE: ${{ steps.release.outputs.trust_mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TAG_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_TAG_PUBLIC_KEY_BASE64 }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          if ($env:TRUST_MODE -eq 'sigstore') {
            git config --local gpg.format x509
            git config --local gpg.x509.program (Get-Command gitsign -ErrorAction Stop).Source
            $identity = "https://github.com/$env:WORKFLOW_REF"
            gitsign verify --certificate-identity $identity --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Sigstore release-tag verification failed' }
          } else {
            if (-not $env:RELEASE_TAG_PUBLIC_KEY_BASE64) { throw 'Release tag public key is required for externally pushed tags' }
            $keyPath = Join-Path $env:RUNNER_TEMP 'release-tag-public-key.asc'
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:RELEASE_TAG_PUBLIC_KEY_BASE64))
            gpg --batch --import $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'Unable to import release-tag verification key' }
            git tag -v $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) { throw 'GPG release-tag verification failed' }
          }

      - name: Import release certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Signing secrets are required'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $secure = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure | Out-Null

      - name: Build, verify, sign, and package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION -CertificateThumbprint $env:SIGNING_CERT_THUMBPRINT

      - name: Attest release archive provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'dist/*.zip'

      - name: Attest raw executable provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'dist/*.exe'

      - name: Attest x64 binary SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'dist/agentstack-windows-amd64.exe'
          sbom-path: 'dist/agentstack-binary-amd64.cdx.json'

      - name: Attest ARM64 binary SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'dist/agentstack-windows-arm64.exe'
          sbom-path: 'dist/agentstack-binary-arm64.cdx.json'

      - name: Attest catalog SBOM provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: 'dist/agentstack-catalog.cdx.json'

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  arm64-runtime-proof:
    name: Verify signed ARM64 runtime
    needs: build-sign-package
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.build-sign-package.outputs.release_tag }}
          path: dist

      - name: Verify and smoke signed ARM64 bundle
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*windows-arm64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'ARM64 bundle missing' }
          Expand-Archive $zip.FullName -DestinationPath extracted
          $setup = Get-ChildItem extracted -Recurse -Filter AgentStack-Setup.exe | Select-Object -First 1
          $console = Get-ChildItem extracted -Recurse -Filter agentstack-windows-arm64.exe | Select-Object -First 1
          $manifest = Get-ChildItem extracted -Recurse -Filter SHA256SUMS.txt | Select-Object -First 1
          if (-not $setup -or -not $console -or -not $manifest) { throw 'ARM64 bundle is incomplete' }

          $root = Split-Path -Parent $manifest.FullName
          foreach ($line in Get-Content $manifest.FullName) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}(.+)$') { throw "Invalid checksum line: $line" }
            $file = Join-Path $root $Matches[2]
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $Matches[1].ToLowerInvariant()) {
              throw "Checksum mismatch: $($Matches[2])"
            }
          }

          $signatures = @($setup, $console | ForEach-Object { Get-AuthenticodeSignature $_.FullName })
          foreach ($signature in $signatures) {
            if ($signature.Status -ne 'Valid') { throw 'Invalid ARM64 Authenticode signature' }
          }
          if ($signatures[0].SignerCertificate.Thumbprint -ne $signatures[1].SignerCertificate.Thumbprint) {
            throw 'ARM64 setup and console have different publishers'
          }

          & $setup.FullName --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 graphical setup pair verification failed' }
          & $console.FullName version
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 runtime smoke failed' }
          & $console.FullName catalog | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 catalog smoke failed' }

  publish-release:
    name: Publish GitHub Release
    needs: [build-sign-package, arm64-runtime-proof]
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ needs.build-sign-package.outputs.release_tag }}
          path: dist

      - name: Verify top-level release manifest
        shell: pwsh
        run: |
          if (-not (Test-Path dist/SHA256SUMS.txt)) { throw 'Top-level checksum manifest missing' }
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s{2}(.+)$') { throw "Invalid checksum line: $line" }
            $file = Join-Path dist $Matches[2]
            if (-not (Test-Path $file)) { throw "Release file missing: $($Matches[2])" }
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $Matches[1].ToLowerInvariant()) {
              throw "Release checksum mismatch: $($Matches[2])"
            }
          }

      - name: Verify GitHub artifact attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build-sign-package.outputs.release_version }}
        run: |
          $subjects = @(
            "dist/AgentStackManager-$env:RELEASE_VERSION-windows-amd64.zip",
            "dist/AgentStackManager-$env:RELEASE_VERSION-windows-arm64.zip",
            "dist/AgentStackManager-$env:RELEASE_VERSION-source.zip",
            'dist/agentstack-windows-amd64.exe',
            'dist/agentstack-windows-arm64.exe',
            'dist/AgentStack-Setup-windows-amd64.exe',
            'dist/AgentStack-Setup-windows-arm64.exe'
          )
          foreach ($subject in $subjects) {
            if (-not (Test-Path -LiteralPath $subject)) { throw "Attested subject missing: $subject" }
            gh attestation verify $subject --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $subject" }
          }

      - name: Create immutable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-sign-package.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build-sign-package.outputs.release_version }}
          RELEASE_PRERELEASE: ${{ needs.build-sign-package.outputs.prerelease }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw "GitHub Release already exists: $env:RELEASE_TAG" }

          $assets = @(
            "dist/AgentStackManager-$env:RELEASE_VERSION-windows-amd64.zip",
            "dist/AgentStackManager-$env:RELEASE_VERSION-windows-arm64.zip",
            "dist/AgentStackManager-$env:RELEASE_VERSION-source.zip",
            'dist/agentstack-windows-amd64.exe',
            'dist/agentstack-windows-arm64.exe',
            'dist/AgentStack-Setup-windows-amd64.exe',
            'dist/AgentStack-Setup-windows-arm64.exe',
            'dist/AgentStack-Setup.ps1',
            'dist/SHA256SUMS.txt',
            'dist/agentstack-catalog.cdx.json',
            'dist/agentstack-binary-amd64.cdx.json',
            'dist/agentstack-binary-arm64.cdx.json',
            'dist/agentstack.openvex.json',
            'dist/provenance.json',
            'dist/component-licenses.json'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset missing: $asset" }
          }

          $releaseArguments = @(
            $env:RELEASE_TAG,
            '--repo', $env:GH_REPO,
            '--verify-tag',
            '--generate-notes',
            '--title', "AgentStack Manager $env:RELEASE_VERSION"
          )
          if ($env:RELEASE_PRERELEASE -eq 'true') { $releaseArguments += '--prerelease' }
          $releaseArguments += $assets
          gh release create @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed' }
